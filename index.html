<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic AI Defense Checklist</title>
<meta name="description" content="43 security checkpoints for AI agent systems — based on the McKinsey/Lilli breach">
<meta property="og:title" content="Agentic AI Defense Checklist">
<meta property="og:description" content="43 security checkpoints for AI agent systems — based on the McKinsey/Lilli breach (March 2026). 9 categories covering API surface, injection, prompt integrity, isolation, secrets, MCP security, sandboxing, hooks, and supply chain.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://janrummel.github.io/agentic-ai-defense-checklist/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Agentic AI Defense Checklist">
<meta name="twitter:description" content="43 security checkpoints for AI agent systems — based on the McKinsey/Lilli breach">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  min-height: 100vh;
  background: #08080C;
  color: #E8E8EC;
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
  line-height: 1.5;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

.header {
  padding: 32px 24px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  max-width: 900px;
  margin: 0 auto;
}
.header-tags {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.tag-version {
  font-size: 10px;
  letter-spacing: 4px;
  color: #FF2D2D;
  font-weight: 700;
  opacity: 0.8;
}
.tag-lilli {
  font-size: 9px;
  padding: 2px 8px;
  border-radius: 3px;
  background: rgba(255,45,45,0.1);
  color: #FF6B6B;
  border: 1px solid rgba(255,45,45,0.15);
}
.header h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 8px 0;
  background: linear-gradient(135deg, #FF2D2D, #FF6B00, #EAB308);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-subtitle {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  line-height: 1.6;
}

/* Score Badge */
.score-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-top: 16px;
  border: 1px solid;
  transition: all 0.3s ease;
}
.score-critical { background: rgba(255,45,45,0.12); color: #FF2D2D; border-color: rgba(255,45,45,0.3); }
.score-at_risk { background: rgba(255,107,0,0.12); color: #FF6B00; border-color: rgba(255,107,0,0.3); }
.score-acceptable { background: rgba(234,179,8,0.12); color: #EAB308; border-color: rgba(234,179,8,0.3); }
.score-hardened { background: rgba(34,197,94,0.12); color: #22C55E; border-color: rgba(34,197,94,0.3); }

/* Progress */
.progress-section { margin-top: 20px; }
.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 8px;
}
.progress-label { font-size: 11px; color: rgba(255,255,255,0.5); }
.progress-stats { display: flex; gap: 16px; }
.progress-stat { font-size: 11px; color: rgba(255,255,255,0.5); }
.progress-stat strong { color: #E8E8EC; font-weight: 700; }
.progress-stat-critical { font-size: 11px; transition: color 0.3s; }
.progress-stat-critical strong { font-weight: 700; }
.progress-track {
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.4s ease, background 0.4s ease;
}

/* Categories */
.categories {
  padding: 16px 16px 140px;
  max-width: 900px;
  margin: 0 auto;
}
.category-card {
  background: rgba(10, 10, 15, 0.85);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.3s ease;
}
.category-card.expanded {
  border-color: var(--accent);
}
.category-header {
  display: flex;
  align-items: center;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  gap: 14px;
}
.category-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
.category-info { flex: 1; min-width: 0; }
.category-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.category-number {
  font-size: 10px;
  letter-spacing: 2px;
  opacity: 0.7;
}
.category-title {
  font-size: 13px;
  font-weight: 700;
  color: #E8E8EC;
  letter-spacing: 1.5px;
}
.category-subtitle {
  font-size: 10px;
  color: rgba(255,255,255,0.35);
  margin-top: 3px;
}
.category-badges { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.lilli-badge {
  font-size: 8px;
  padding: 1px 6px;
  border-radius: 3px;
  background: rgba(255,45,45,0.1);
  color: #FF6B6B;
  border: 1px solid rgba(255,45,45,0.15);
  letter-spacing: 1px;
  font-weight: 600;
  white-space: nowrap;
}
.category-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.category-counts { text-align: right; }
.category-count-total {
  font-size: 12px;
  font-weight: 600;
  transition: color 0.3s;
}
.category-count-critical {
  font-size: 9px;
  color: rgba(255,255,255,0.3);
}
.category-progress-ring { width: 40px; height: 40px; flex-shrink: 0; }
.ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 3; }
.ring-fill {
  fill: none;
  stroke-width: 3;
  stroke-linecap: round;
  transition: stroke-dasharray 0.4s ease;
}
.category-chevron {
  color: rgba(255,255,255,0.3);
  font-size: 16px;
  transition: transform 0.2s ease;
  flex-shrink: 0;
}
.category-chevron.open { transform: rotate(180deg); }

/* Items */
.category-items { padding: 0 18px 16px; }
.item {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid rgba(255,255,255,0.04);
  cursor: pointer;
  align-items: flex-start;
}
.item-checkbox {
  width: 20px;
  height: 20px;
  min-width: 20px;
  border-radius: 4px;
  border: 2px solid rgba(255,255,255,0.15);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  transition: all 0.15s ease;
  flex-shrink: 0;
}
.item-checkbox.critical-unchecked { border-color: rgba(255,45,45,0.5); }
.item-checkbox.checked {
  border-color: #22C55E;
  background: rgba(34,197,94,0.15);
}
.item-checkbox .checkmark {
  color: #22C55E;
  font-size: 13px;
  font-weight: 700;
  display: none;
}
.item-checkbox.checked .checkmark { display: block; }
.item-content { flex: 1; min-width: 0; }
.item-label-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item-label {
  font-size: 12px;
  color: #E8E8EC;
  transition: all 0.15s ease;
}
.item.checked .item-label {
  color: rgba(255,255,255,0.4);
  text-decoration: line-through;
  text-decoration-color: rgba(255,255,255,0.2);
}
.badge-critical {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 3px;
  background: rgba(255,45,45,0.12);
  color: #FF2D2D;
  letter-spacing: 1px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-critical.done {
  background: rgba(34,197,94,0.1);
  color: #22C55E;
}
.item-detail {
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  margin-top: 4px;
  line-height: 1.5;
}
.item-command {
  font-size: 10px;
  opacity: 0.5;
  margin-top: 4px;
  padding: 4px 8px;
  background: rgba(255,255,255,0.02);
  border-radius: 3px;
  border-left: 2px solid;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
}

/* Bottom bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(8,8,12,0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.06);
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  z-index: 50;
  justify-content: center;
}
.bottom-bar-inner {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 900px;
}
.btn {
  padding: 12px 16px;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.btn-copy {
  flex: 1;
  border: 1px solid rgba(255,107,0,0.3);
  background: linear-gradient(135deg, rgba(255,45,45,0.12), rgba(255,107,0,0.12));
  color: #FF6B00;
  font-weight: 700;
  letter-spacing: 1px;
}
.btn-copy:hover { background: linear-gradient(135deg, rgba(255,45,45,0.2), rgba(255,107,0,0.2)); }
.btn-copy.copied {
  background: rgba(34,197,94,0.15);
  color: #22C55E;
  border-color: rgba(34,197,94,0.3);
}
.btn-secondary {
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.5);
}
.btn-secondary:hover { background: rgba(255,255,255,0.08); }
.btn-github {
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.5);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 16px;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}
.btn-github:hover { background: rgba(255,255,255,0.08); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: none;
  flex-direction: column;
  padding: 16px;
}
.modal-overlay.active { display: flex; }
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.modal-title {
  font-size: 12px;
  font-weight: 700;
  color: #FF6B00;
  letter-spacing: 1px;
}
.modal-close {
  background: none;
  border: none;
  color: rgba(255,255,255,0.5);
  font-size: 20px;
  cursor: pointer;
  padding: 4px 8px;
}
.modal-close:hover { color: #E8E8EC; }
.modal-content {
  flex: 1;
  overflow: auto;
  background: rgba(10,10,15,0.9);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  padding: 16px;
  font-size: 10px;
  line-height: 1.6;
  color: rgba(255,255,255,0.6);
  white-space: pre-wrap;
  word-break: break-word;
}
.modal-copy {
  margin-top: 12px;
  padding: 14px;
  border-radius: 6px;
  border: none;
  background: linear-gradient(135deg, #FF2D2D, #FF6B00);
  color: #FFF;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.2s ease;
}
.modal-copy:hover { opacity: 0.9; }
.modal-copy.copied {
  background: rgba(34,197,94,0.2);
  color: #22C55E;
}

/* Responsive */
@media (max-width: 600px) {
  .header { padding: 24px 16px 20px; }
  .header h1 { font-size: 18px; }
  .category-header { padding: 12px 14px; gap: 10px; }
  .category-title { font-size: 11px; letter-spacing: 1px; }
  .category-items { padding: 0 14px 12px; }
  .progress-header { flex-direction: column; gap: 4px; }
  .bottom-bar { padding: 10px 12px; }
  .btn { padding: 10px 12px; font-size: 11px; }
  .btn-github span.gh-label { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-tags">
    <span class="tag-version">SECURITY AUDIT v2.0</span>
    <span class="tag-lilli">LILLI-EXTENDED</span>
  </div>
  <h1>Agentic AI Defense Checklist</h1>
  <p class="header-subtitle">
    43 checkpoints &middot; 9 categories &middot; Based on the McKinsey/Lilli Breach (March 2026)
  </p>

  <div id="scoreBadge" class="score-badge score-critical">
    <span id="scoreEmoji"></span>
    <span id="scoreLabel"></span>
  </div>

  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-label">Progress</span>
      <div class="progress-stats">
        <span class="progress-stat"><strong id="checkedCount">0</strong>/43 total</span>
        <span class="progress-stat-critical" id="criticalStat"><strong id="criticalChecked">0</strong>/24 critical</span>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<div class="categories" id="categoriesContainer"></div>

<div class="bottom-bar">
  <div class="bottom-bar-inner">
    <button class="btn btn-copy" id="btnCopy" onclick="handleCopy()">COPY AUDIT PROMPT</button>
    <button class="btn btn-secondary" id="btnPreview" onclick="toggleModal()">{ }</button>
    <button class="btn btn-secondary" onclick="handleReset()">&#8634;</button>
    <a class="btn-github" href="https://github.com/janrummel/agentic-ai-defense-checklist" target="_blank" rel="noopener noreferrer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span class="gh-label">GitHub</span>
    </a>
  </div>
</div>

<div class="modal-overlay" id="promptModal">
  <div class="modal-header">
    <span class="modal-title">AUDIT PROMPT PREVIEW</span>
    <button class="modal-close" onclick="toggleModal()">&times;</button>
  </div>
  <pre class="modal-content" id="promptContent"></pre>
  <button class="modal-copy" id="modalCopyBtn" onclick="handleCopy()">COPY PROMPT</button>
</div>

<script>
// ============================================================
// DATA (from checklist.json)
// ============================================================
const DATA = {
  categories: [
    {
      id: "api-surface",
      number: "01",
      title: "API SURFACE & EXPOSURE",
      subtitle: "Lilli lesson: 22 unauthenticated endpoints were the entry point",
      icon: "\u26A1",
      accent: "#FF2D2D",
      lilli_vector: true,
      items: [
        { id: "api-1", ref: "1.1", label: "Complete endpoint inventory", detail: "All publicly reachable endpoints documented. Run: nmap + API doc scan on host IP", critical: true, check_command: "nmap -sV <host-ip> && curl -s http://<host>/docs" },
        { id: "api-2", ref: "1.2", label: "No publicly exposed API documentation", detail: "Swagger/OpenAPI docs were the entry point at Lilli. Check /docs, /swagger, /openapi.json, /redoc, /api-docs", critical: true, check_command: 'for path in /docs /swagger /openapi.json /redoc /api-docs; do curl -s -o /dev/null -w "%{http_code} $path\\n" http://<host>$path; done' },
        { id: "api-3", ref: "1.3", label: "All endpoints require authentication", detail: "Including health checks that may leak internal info. Test each endpoint without auth token", critical: true, check_command: "curl -s -H 'Authorization: ' http://<host>/api/v1/<endpoint> | head -20" },
        { id: "api-4", ref: "1.4", label: "Rate limiting on all endpoints", detail: "Without rate limiting, an agent can probe hundreds of endpoints per second", critical: false, check_command: "for i in $(seq 1 100); do curl -s -o /dev/null -w '%{http_code}\\n' http://<host>/api/health; done | sort | uniq -c" },
        { id: "api-5", ref: "1.5", label: "Error responses don't leak internals", detail: "No stack traces, DB schemas, or internal paths in error responses", critical: false, check_command: "curl -s -X POST http://<host>/api/v1/search -d '{\"invalid'" }
      ]
    },
    {
      id: "injection",
      number: "02",
      title: "INJECTION & INPUT VALIDATION",
      subtitle: "Lilli lesson: JSON keys concatenated directly into SQL",
      icon: "\uD83D\uDEE1",
      accent: "#FF6B00",
      lilli_vector: true,
      items: [
        { id: "inj-1", ref: "2.1", label: "All DB queries fully parameterized", detail: "Including field names, sort orders, table names \u2014 not just values. At Lilli, values were safe but keys were not", critical: true, check_command: "grep -rn 'f\".*SELECT\\|f\".*INSERT\\|f\".*UPDATE\\|format.*SELECT\\|%s.*SELECT' --include='*.py' ." },
        { id: "inj-2", ref: "2.2", label: "External input sanitized before tool/DB forwarding", detail: "Messages from messaging platforms/webhooks sanitized before passing to MCP tools or databases", critical: true, check_command: "# Review: How does messaging input flow through to DB/tool calls?" },
        { id: "inj-3", ref: "2.3", label: "Allowlist for dynamic query field names", detail: "No user-controlled keys in SQL/NoSQL. Maintain explicit allowlist of valid field names", critical: true, check_command: "# Review: Are there places where request.body keys flow into queries?" },
        { id: "inj-4", ref: "2.4", label: "MCP tool responses validated for prompt injection", detail: "Tool responses can contain crafted content that manipulates AI behavior. Treat all tool responses as untrusted", critical: true, check_command: "# Review: Are MCP tool responses validated/sanitized before AI processes them?" },
        { id: "inj-5", ref: "2.5", label: "No differential error responses enabling schema enumeration", detail: "CodeWall's agent used blind error-based probing. Uniform errors for 'not found' vs 'query error'", critical: false, check_command: "# Test: Do malformed queries return different error codes/messages?" }
      ]
    },
    {
      id: "prompt-integrity",
      number: "03",
      title: "PROMPT & SKILL INTEGRITY",
      subtitle: "Lilli lesson: System prompts in same DB as user data \u2014 writable",
      icon: "\uD83D\uDD10",
      accent: "#00D4FF",
      lilli_vector: true,
      items: [
        { id: "pi-1", ref: "3.1", label: "System prompts/config under version control", detail: "Protected branches, no direct push to main. Changes require PR review", critical: true, check_command: "git log --oneline -5 -- CLAUDE.md AGENTS.md && git config branch.main.protection" },
        { id: "pi-2", ref: "3.2", label: "Write-protection hook for config files", detail: "PreToolUse hook blocks automated writes to SKILL.md, CLAUDE.md, AGENTS.md or equivalent", critical: true, check_command: "cat ~/.claude/settings.json | python3 -c \"import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('hooks',{}), indent=2))\"" },
        { id: "pi-3", ref: "3.3", label: "Prompt integrity hash verification", detail: "SHA256 hashes compared at startup or in CI. See examples/ci/prompt-integrity-check.sh", critical: false, check_command: "sha256sum CLAUDE.md AGENTS.md skills/*.md 2>/dev/null" },
        { id: "pi-4", ref: "3.4", label: "Prompt storage separated from user data", detail: "System prompts NOT in the same DB as user data \u2014 this was the core Lilli problem", critical: true, check_command: "# Review: Where are config files stored? Same access path as user data?" },
        { id: "pi-5", ref: "3.5", label: "Skill activation only through manual config", detail: "New skills cannot be dynamically activated by user input or MCP responses", critical: false, check_command: "# Review: Can an agent create and activate new SKILL.md files via tool calls?" }
      ]
    },
    {
      id: "cross-user",
      number: "04",
      title: "CROSS-USER ISOLATION",
      subtitle: "Lilli lesson: IDOR allowed access to other employees' search histories",
      icon: "\uD83D\uDC64",
      accent: "#A855F7",
      lilli_vector: true,
      items: [
        { id: "cu-1", ref: "4.1", label: "User data strictly separated", detail: "Cross-platform/cross-tenant isolation. One platform user cannot access another platform's conversations", critical: true, check_command: "# Review: How are user sessions separated across platforms?" },

const STORAGE_KEY = "agentic-ai-defense-checklist-v2";
let checkedItems = {};
let expandedCategories = {};

// Load from localStorage
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) checkedItems = JSON.parse(saved);
} catch (e) {}

// ============================================================
// SCORING
// ============================================================
function getAllItems() {
  return DATA.categories.flatMap(c => c.items);
}

function evaluateScore() {
  const items = getAllItems();
  const critical = items.filter(i => i.critical);
  const recommended = items.filter(i => !i.critical);
  const criticalDone = critical.filter(i => checkedItems[i.id]).length;
  const criticalMissing = critical.length - criticalDone;
  const recDone = recommended.filter(i => checkedItems[i.id]).length;
  const recPct = recommended.length > 0 ? recDone / recommended.length : 1;
  if (criticalMissing === 0 && recPct >= 0.8) return "hardened";
  if (criticalMissing === 0) return "acceptable";
  if (criticalMissing <= 5) return "at_risk";
  return "critical";
}

const SCORE_CONFIG = {
  hardened:   { label: "Hardened",   emoji: "\uD83D\uDFE2" },
  acceptable: { label: "Acceptable", emoji: "\uD83D\uDFE1" },
  at_risk:    { label: "At Risk",    emoji: "\uD83D\uDFE0" },
  critical:   { label: "Critical",   emoji: "\uD83D\uDD34" }
};

// ============================================================
// RENDER
// ============================================================
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedItems)); } catch (e) {}
}

function toggleItem(id) {
  checkedItems[id] = !checkedItems[id];
  saveState();
  render();
}

function toggleCategory(id) {
  expandedCategories[id] = !expandedCategories[id];
  render();
}

function handleReset() {
  if (!confirm("Reset all checkboxes?")) return;
  checkedItems = {};
  saveState();
  render();
}

function handleCopy() {
  const btnCopy = document.getElementById("btnCopy");
  const modalCopyBtn = document.getElementById("modalCopyBtn");
  try {
    navigator.clipboard.writeText(AUDIT_PROMPT).then(() => {
      showCopied(btnCopy, modalCopyBtn);
    }).catch(() => {
      fallbackCopy(btnCopy, modalCopyBtn);
    });
  } catch (e) {
    fallbackCopy(btnCopy, modalCopyBtn);
  }
}

function fallbackCopy(btnCopy, modalCopyBtn) {
  const ta = document.createElement("textarea");
  ta.value = AUDIT_PROMPT;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
  showCopied(btnCopy, modalCopyBtn);
}

function showCopied(btnCopy, modalCopyBtn) {
  btnCopy.textContent = "\u2713 COPIED";
  btnCopy.classList.add("copied");
  modalCopyBtn.textContent = "\u2713 COPIED TO CLIPBOARD";
  modalCopyBtn.classList.add("copied");
  setTimeout(() => {
    btnCopy.textContent = "COPY AUDIT PROMPT";
    btnCopy.classList.remove("copied");
    modalCopyBtn.textContent = "COPY PROMPT";
    modalCopyBtn.classList.remove("copied");
  }, 2000);
}

function toggleModal() {
  const modal = document.getElementById("promptModal");
  modal.classList.toggle("active");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function render() {
  const allItems = getAllItems();
  const totalItems = allItems.length;
  const checkedCount = allItems.filter(i => checkedItems[i.id]).length;
  const criticalItems = allItems.filter(i => i.critical);
  const criticalChecked = criticalItems.filter(i => checkedItems[i.id]).length;
  const overallProgress = totalItems > 0 ? checkedCount / totalItems : 0;

  // Score
  const scoreId = evaluateScore();
  const scoreConf = SCORE_CONFIG[scoreId];
  const scoreBadge = document.getElementById("scoreBadge");
  scoreBadge.className = "score-badge score-" + scoreId;
  document.getElementById("scoreEmoji").textContent = scoreConf.emoji;
  document.getElementById("scoreLabel").textContent = scoreConf.label;

  // Progress
  document.getElementById("checkedCount").textContent = checkedCount;
  document.getElementById("criticalChecked").textContent = criticalChecked;
  const criticalStat = document.getElementById("criticalStat");
  const allCritDone = criticalChecked === criticalItems.length;
  criticalStat.style.color = allCritDone ? "#22C55E" : "#FF2D2D";
  const fill = document.getElementById("progressFill");
  fill.style.width = (overallProgress * 100) + "%";
  fill.style.background = overallProgress === 1
    ? "#22C55E"
    : "linear-gradient(90deg, #FF2D2D, #FF6B00, #EAB308)";

  // Categories
  const container = document.getElementById("categoriesContainer");
  let html = "";

  for (const cat of DATA.categories) {
    const completedCount = cat.items.filter(i => checkedItems[i.id]).length;
    const catCritical = cat.items.filter(i => i.critical);
    const catCritDone = catCritical.filter(i => checkedItems[i.id]).length;
    const catAllCritDone = catCritDone === catCritical.length;
    const progress = cat.items.length > 0 ? completedCount / cat.items.length : 0;
    const isExpanded = expandedCategories[cat.id];
    const circumference = 2 * Math.PI * 16; // r=16
    const dashArray = (progress * circumference) + " " + circumference;

    html += `<div class="category-card${isExpanded ? ' expanded' : ''}" style="--accent: ${cat.accent}">
      <div class="category-header" onclick="toggleCategory('${cat.id}')">
        <span class="category-icon">${cat.icon}</span>
        <div class="category-info">
          <div class="category-title-row">
            <span class="category-number" style="color: ${cat.accent}">${cat.number}</span>
            <span class="category-title">${escapeHtml(cat.title)}</span>
          </div>
          <div class="category-subtitle">${escapeHtml(cat.subtitle)}</div>
          ${cat.lilli_vector ? '<div class="category-badges"><span class="lilli-badge">LILLI VECTOR</span></div>' : ''}
        </div>
        <div class="category-right">
          <div class="category-counts">
            <div class="category-count-total" style="color: ${catAllCritDone && completedCount === cat.items.length ? '#22C55E' : catAllCritDone ? '#EAB308' : '#FF2D2D'}">${completedCount}/${cat.items.length}</div>
            <div class="category-count-critical">${catCritDone}/${catCritical.length} critical</div>
          </div>
          <svg class="category-progress-ring" viewBox="0 0 40 40">
            <circle class="ring-bg" cx="20" cy="20" r="16" />
            <circle class="ring-fill" cx="20" cy="20" r="16" stroke="${cat.accent}" stroke-dasharray="${dashArray}" transform="rotate(-90 20 20)" />
          </svg>
          <span class="category-chevron${isExpanded ? ' open' : ''}">&#9662;</span>
        </div>
      </div>`;

    if (isExpanded) {
      html += '<div class="category-items">';
      for (const item of cat.items) {
        const isChecked = !!checkedItems[item.id];
        const cbClass = isChecked ? "checked" : (item.critical ? "critical-unchecked" : "");
        html += `<div class="item${isChecked ? ' checked' : ''}" onclick="toggleItem('${item.id}')">
          <div class="item-checkbox ${cbClass}"><span class="checkmark">\u2713</span></div>
          <div class="item-content">
            <div class="item-label-row">
              <span class="item-label">${escapeHtml(item.label)}</span>
              ${item.critical ? `<span class="badge-critical${isChecked ? ' done' : ''}">CRITICAL</span>` : ''}
            </div>
            <div class="item-detail">${escapeHtml(item.detail)}</div>
            ${item.check_command ? `<div class="item-command" style="color: ${cat.accent}; border-left-color: ${cat.accent}30">$ ${escapeHtml(item.check_command)}</div>` : ''}
          </div>
        </div>`;
      }
      html += '</div>';
    }

    html += '</div>';
  }

  container.innerHTML = html;

  // Prompt content
  document.getElementById("promptContent").textContent = AUDIT_PROMPT;
}
